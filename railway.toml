[build]
builder = "NIXPACKS"
buildCommand = "npm run build && npm prune --omit=dev"
nixpacksConfigPath = "nixpacks.toml"

[deploy]
startCommand = "npm run official-supply:cluster-b-v4-style-proof && npm run start"
healthcheckPath = "/health"
healthcheckTimeout = 600
restartPolicyType = "on_failure"
