name: Validate live-follow UI

on:
  pull_request:
    paths:
      - ".github/workflows/validate-live-follow-ui.yml"
      - "playwright.config.ts"
      - "package.json"
      - "tests/ui/**"
      - "src/app/chat/**"
      - "src/lib/chatLiveFollow.ts"
      - "src/lib/chatBillingPresentation.ts"
      - "src/lib/integerScrollTransport.ts"
      - "src/lib/emotionTag.ts"
      - "src/lib/inlineTaggedAssets.ts"
      - "src/lib/chatRichContent.ts"
      - "src/lib/jsxComponent/**"
      - "src/components/JsxComponentSandbox.tsx"
      - "src/components/JsxHostBridge.tsx"
      - "public/jsx-sandbox/**"
      - "scripts/build-jsx-sandbox.ts"
      - "src/lib/userInputDraft*.ts"
      - "src/lib/chatStreamDraftRecovery*.ts"
      - "src/app/trpg/**"
      - "src/lib/trpg/**"

permissions:
  contents: read

jobs:
  live-follow-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REGULAR_TEST_REAL_PROVIDER_CALLS: "0"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: User input draft custody
        run: >-
          node --conditions=react-server --import tsx --test
          src/lib/userInputDraftCustody.test.ts
          src/lib/chatStreamDraftRecovery.test.ts

      - name: JSX authoring draft and status widget mode regressions
        run: >-
          node --conditions=react-server --import tsx --test
          src/lib/jsxComponent/catalogDraft.test.ts
          src/lib/jsxComponent/jsxComponent.test.ts
          src/lib/statusWidget/authoringChoice.test.ts
          src/lib/statusWidget/jsxSource.test.ts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Suggested Replies browser lifecycle
        run: >
          npx playwright test
          tests/ui/suggested-replies.spec.ts
          --workers=1
          --retries=0

      - name: Live-follow browser regression
        run: >
          npx playwright test
          tests/ui/chat-live-follow.spec.ts
          tests/ui/trpg-scroll-follow.spec.ts
          tests/ui/chat-asset-display.spec.ts
          --workers=1
          --retries=0

      - name: JSX sandbox browser regression
        run: >
          npx playwright test
          tests/ui/jsx-sandbox-runtime.spec.ts
          --workers=1
          --retries=0

      - name: Upload Playwright failure artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-follow-playwright-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
