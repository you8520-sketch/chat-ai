name: Validate chat stream draft recovery

on:
  pull_request:
    paths:
      - "src/lib/chatStreamDraftRecovery.ts"
      - "src/lib/chatStreamDraftRecovery.test.ts"
      - "src/lib/streamDraftLifecycle.ts"
      - "src/lib/streamingPersistenceShared.ts"
      - "src/app/chat/[id]/ChatClient.tsx"
      - ".github/workflows/validate-chat-stream-draft-recovery.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck:app
      - run: node --conditions=react-server --import tsx --test src/lib/chatStreamDraftRecovery.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/streamDraftLifecycle.test.ts
