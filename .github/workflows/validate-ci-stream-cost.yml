name: Validate CI exact-cost compatibility (synthetic fixtures)

on:
  pull_request:
    paths:
      - ".github/workflows/validate-ci-stream-cost.yml"
      - "src/lib/openRouterUsage.ts"
      - "src/lib/openRouterAdult.ts"
      - "src/lib/openRouterAdult.compatibleUsage.test.ts"
      - "src/lib/openRouterAdult.ciStreamCost.test.ts"
      - "src/lib/cheaperInferenceUsage.ts"
      - "src/lib/providerCostReconciliation.ts"
      - "src/lib/providerCostReconciliation.targeted.test.ts"
      - "src/lib/providerCostLedger.ts"
      - "src/lib/adminBillingReceiptV3.ts"
      - "src/lib/adminBillingReceiptV3Shared.ts"
      - "src/lib/adminBillingReceiptV3.compactViewModel.test.ts"
      - "src/lib/asyncTurnCoverage.ts"
      - "src/lib/asyncTurnCoverage.statusMetaExpectation.test.ts"
      - "src/lib/statusMeta/types.ts"
      - "src/lib/statusMeta/job.ts"
      - "src/lib/statusMeta/displayPolicy.ts"
      - "src/lib/statusMeta/statusMeta.previousTurnGeneration.test.ts"
      - "src/app/api/chat/status-meta/route.ts"
      - "src/app/api/chat/route.ts"
      - "src/lib/chatBillingSettlement.ts"
      - "src/lib/chatBillingSettlement.test.ts"
      - "src/lib/chatBillingDeliveryIntegrity.test.ts"
      - "src/lib/storedTurnChargeEvidence.test.ts"
      - "src/lib/chatStreamTerminalization.test.ts"
      - "src/lib/chatStreamEofReconcile.test.ts"
      - "src/lib/streamingPersistenceShared.ts"
      - "src/lib/rpDerivedStateLifecycle.ts"
      - "src/lib/refund.ts"
      - "src/lib/pointPolicyUnification.test.ts"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REGULAR_TEST_REAL_PROVIDER_CALLS: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: git diff --check

      - run: npm run lint

      - run: npm run typecheck:app

      - name: CheaperInference compatible usage (stream + non-stream)
        run: node --conditions=react-server --import tsx --test src/lib/openRouterAdult.compatibleUsage.test.ts

      - name: CheaperInference synthetic exact-cost compatibility (not Main live contract)
        run: node --conditions=react-server --import tsx --test src/lib/openRouterAdult.ciStreamCost.test.ts

      - name: Provider cost ledger single owner
        run: node --conditions=react-server --import tsx --test src/lib/providerCostSingleOwner.test.ts

      - name: Targeted Usage API reconciliation (T1-T11)
        run: node --conditions=react-server --import tsx --test src/lib/providerCostReconciliation.targeted.test.ts

      - name: Admin Receipt compact view model provenance (P1-P5)
        run: node --conditions=react-server --import tsx --test src/lib/adminBillingReceiptV3.compactViewModel.test.ts

      - name: Status Meta async expectation (S1-S8)
        run: node --conditions=react-server --import tsx --test src/lib/asyncTurnCoverage.statusMetaExpectation.test.ts

      - name: Status Meta previous-turn continuity (S9)
        run: node --conditions=react-server --import tsx --test src/lib/statusMeta/statusMeta.previousTurnGeneration.test.ts

      - name: Billing delivery integrity (D1-D14, D3b/D13b)
        run: node --conditions=react-server --import tsx --test src/lib/chatBillingDeliveryIntegrity.test.ts

      - name: Chat billing settlement exactly-once
        run: node --conditions=react-server --import tsx --test src/lib/chatBillingSettlement.test.ts

      - name: Stored turn charge evidence
        run: node --conditions=react-server --import tsx --test src/lib/storedTurnChargeEvidence.test.ts

      - name: Chat stream terminalization
        run: node --conditions=react-server --import tsx --test src/lib/chatStreamTerminalization.test.ts

      - name: Chat stream EOF reconcile
        run: node --conditions=react-server --import tsx --test src/lib/chatStreamEofReconcile.test.ts

      - name: Refund integrity regression
        run: node --conditions=react-server --import tsx --test src/lib/pointPolicyUnification.test.ts
