name: Validate completion-integrity JEV runtime

# Deterministic CI for Main RP completion-integrity JEV read-only QA shadow.
# Default OFF — no live provider calls (REGULAR_TEST_REAL_PROVIDER_CALLS=0).

on:
  pull_request:
    paths:
      - ".github/workflows/validate-completion-integrity-jev-runtime.yml"
      - "src/app/api/chat/route.ts"
      - "src/lib/completionIntegrityJevQa.ts"
      - "src/lib/completionIntegrityJevQa.test.ts"
      - "src/lib/completionIntegrityCandidate.ts"
      - "src/lib/generationScopedAuxQaClaim.ts"
      - "src/lib/sceneBoundaryJevQa.ts"
      - "src/lib/sceneBoundaryJevQa.test.ts"
      - "src/lib/responseLength.ts"
      - "src/lib/responseLength.recovery.test.ts"
      - "src/lib/sentenceCompletionRecovery.ts"
      - "src/lib/sentenceCompletionRecovery.test.ts"
      - "src/lib/jevDecisions.ts"
      - "src/lib/jevDecisions.test.ts"
      - "src/lib/auxProviderProvenance.ts"
      - "src/lib/chatBillingDeliveryIntegrity.test.ts"
      - "src/lib/chatStreamDraftRecovery.test.ts"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REGULAR_TEST_REAL_PROVIDER_CALLS: "0"
      COMPLETION_INTEGRITY_JEV_QA_ENABLED: "0"
      SCENE_BOUNDARY_JEV_QA_ENABLED: "0"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: git diff --check
      - run: npm run lint
      - run: npm run typecheck:app
      - name: Completion-integrity runtime QA + adjacent regressions
        run: >
          node --conditions=react-server --import tsx
          --import ./src/lib/test/regularTestEgressPolicy.ts
          --test --test-concurrency=1
          src/lib/completionIntegrityJevQa.test.ts
          src/lib/sceneBoundaryJevQa.test.ts
          src/lib/responseLength.recovery.test.ts
          src/lib/sentenceCompletionRecovery.test.ts
          src/lib/jevDecisions.test.ts
          src/lib/chatBillingDeliveryIntegrity.test.ts
          src/lib/chatStreamDraftRecovery.test.ts
