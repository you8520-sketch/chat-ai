name: TEMP official supply final check

on:
  push:
    branches:
      - tmp/official-supply-final-check

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SESSION_SECRET: "01234567890123456789012345678901"
      WITHDRAWAL_ENCRYPTION_KEY: "01234567890123456789012345678901"
      REGULAR_TEST_REAL_PROVIDER_CALLS: "0"
      DISABLE_WEB_PUSH: "1"
      DISABLE_PAYOUT_SCHEDULER: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:app
      - name: Official supply zero-call operators
        run: |
          npm run official-supply:style-proof
          npm run official-supply:generate-rofan-v4-anchors
          npm run official-supply:approve-anchor
          npm run official-supply:generate-lucian-variations
      - name: Official supply regressions
        run: >-
          node --conditions=react-server --import tsx
          --import ./src/lib/test/regularTestEgressPolicy.ts
          --test --test-concurrency=1
          src/lib/officialSupply/*.test.ts
