name: Validate memory episodic

# Canonical CI for summary_seal_batch episodic extraction, same-source
# replacement, and assistant-regen source-mutation invalidation.

on:
  pull_request:
    paths:
      - ".github/workflows/validate-memory-episodic.yml"
      - "src/lib/episodicMemoryFacts.ts"
      - "src/lib/episodicMemoryPackingBudget.test.ts"
      - "src/lib/historicalTruthPolicy.ts"
      - "src/lib/historicalTruthPolicy.test.ts"
      - "src/lib/memory/memory-summary-integrity.ts"
      - "src/lib/memory/memory-summary-integrity.test.ts"
      - "src/lib/memory/memory-batch-source-guard.ts"
      - "src/lib/memory/memory-episodic-extract.ts"
      - "src/lib/memory/memory-episodic-hardening.test.ts"
      - "src/lib/memory/memory-architecture-audit.ts"
      - "src/lib/memory/memory-architecture-audit.test.ts"
      - "src/lib/memory/memory-global-current-memory.test.ts"
      - "src/lib/memory/memory-global-compact-race.test.ts"
      - "src/lib/memory/memory-global-checkpoint.ts"
      - "src/lib/memory/memory-global-compaction-execution.ts"
      - "src/lib/memory/memory-global-checkpoint-lifecycle.test.ts"
      - "src/lib/memory/memory-global-checkpoint-persist.test.ts"
      - "src/lib/memory/memory-summary-persist.ts"
      - "src/lib/memory/memory-medium-term.ts"
      - "src/lib/memory/memory-medium-term.test.ts"
      - "src/lib/memory/memory-medium-term-audit.ts"
      - "src/lib/memory/memory-medium-term-audit.test.ts"
      - "src/lib/memory/memory-medium-term-prompt-budget-audit.ts"
      - "src/lib/memory/memory-medium-term-prompt-budget-audit.test.ts"
      - "src/lib/memory/memory-prompt-injectible-parity.test.ts"
      - "src/lib/memory/memory-feature.ts"
      - "src/lib/memory/memory-injector.ts"
      - "src/lib/memory/memory-types.ts"
      - "src/services/contextBuilder.ts"
      - "src/services/modelPickerInputSnapshot.ts"
      - "src/types.ts"
      - "src/lib/memory/memory-global-projection.ts"
      - "src/lib/memory/memory-global-source-fingerprint.ts"
      - "src/lib/memory/memory-lorebook-resolve.ts"
      - "src/lib/memory/memory-turn-summary.ts"
      - "src/lib/memory/memory-lorebook-fit.ts"
      - "src/lib/memory/memory-episodic-long-horizon.test.ts"
      - "src/lib/memory/memory-retrieval-v2.test.ts"
      - "src/lib/memory/memory-episodic-normalize.ts"
      - "src/lib/memory/memory-episodic-ownership.test.ts"
      - "src/lib/memory/memory-episodic-prompt.ts"
      - "src/lib/memory/memory-episodic-shared.ts"
      - "src/lib/memory/memory-episodic-shared-initial.test.ts"
      - "src/lib/memory/memory-episodic-types.ts"
      - "src/lib/memory/memory-episodic-semantic-config.ts"
      - "src/lib/memory/memory-episodic-semantic-index.ts"
      - "src/lib/memory/memory-episodic-semantic-jobs.ts"
      - "src/lib/memory/memory-episodic-semantic-discovery.test.ts"
      - "src/lib/memory/memory-episodic-semantic-cleanup.test.ts"
      - "src/lib/memory/memory-episodic-semantic-synthetic.test.ts"
      - "src/lib/memory/memory-rp-benchmark-suite.ts"
      - "src/lib/memory/memory-rp-benchmark.ts"
      - "src/lib/memory/memory-rp-benchmark.test.ts"
      - "src/lib/memory/memory-rp-benchmark-hooks.test.ts"
      - "src/lib/openRouterEmbeddings.ts"
      - "src/lib/openRouterEmbeddings.test.ts"
      - "scripts/lib/benchmarkOpenRouterEmbeddingsCredential.ts"
      - "scripts/lib/episodicEmbeddingLiveBenchmark.ts"
      - "scripts/lib/episodicEmbeddingLiveBenchmark.test.ts"
      - "src/lib/memory/memory-manager.ts"
      - "src/lib/runtimePromptContaminationGuard.ts"
      - "src/app/api/chat/route.ts"
      - "src/lib/memory/memory-premerge-blockers.test.ts"
      - "src/lib/memory/memory-regen-scope.test.ts"
      - "src/lib/memory/memory-rolling-summary.ts"
      - "src/lib/memory/memory-source-boundary.test.ts"
      - "src/lib/memory/memory-source-boundary.ts"
      - "src/lib/memory/memory-relationship-meta.ts"
      - "src/lib/memory/memoryRelationshipTask.production.test.ts"
      - "src/lib/memory/memory-relationship-provenance.test.ts"
      - "src/lib/memory/memory-relationship-variant-switch.test.ts"
      - "src/lib/messageAlternates.ts"
      - "src/lib/nonnumericVariantSwitchAtomic.ts"
      - "src/lib/rpDerivedStateLifecycle.ts"
      - "src/lib/rpNumericState/variantSwitchAtomic.ts"
      - "src/lib/chatLastTurnDelete.ts"
      - "src/app/api/chat/turn/route.ts"
      - "src/app/api/chat/fork/route.ts"
      - "src/lib/rpNumericStateTurnDelete.test.ts"
      - "src/lib/db.ts"
      - "src/lib/remoteSchemaCurrentInvariant.ts"
      - "src/lib/remoteSchemaMemoryReachability.test.ts"
      - "src/lib/memoryResearch/**"
      - "scripts/memory-research-cycle.ts"
      - ".github/workflows/memory-research-cycle.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REGULAR_TEST_REAL_PROVIDER_CALLS: "0"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: git diff --check

      - run: npm run lint

      - run: npm run typecheck:app

      - name: Memory architecture audit
        run: node --conditions=react-server --import tsx --test --test-concurrency=1 src/lib/memory/memory-architecture-audit.test.ts

      - name: Global Current Memory owner bugfix regressions
        run: node --conditions=react-server --import tsx --test --test-concurrency=1 src/lib/memory/memory-global-current-memory.test.ts

      - name: Episodic long-horizon regression
        run: node --conditions=react-server --import tsx --test --test-concurrency=1 src/lib/memory/memory-episodic-long-horizon.test.ts

      - name: Episodic Retrieval V2 regression
        run: node --conditions=react-server --import tsx --test --test-concurrency=1 src/lib/memory/memory-retrieval-v2.test.ts

      - name: Episodic packing budget starvation
        run: node --conditions=react-server --import tsx --test --test-concurrency=1 src/lib/episodicMemoryPackingBudget.test.ts

      - name: Episodic hardening regression (E1–E14 / R1)
        run: node --conditions=react-server --import tsx --test --test-concurrency=1 src/lib/memory/memory-episodic-hardening.test.ts

      - name: Shared-history provenance regressions
        run: node --conditions=react-server --import tsx --test --test-concurrency=1 src/lib/historicalTruthPolicy.test.ts src/lib/memory/memory-summary-integrity.test.ts

      - name: Episodic ownership decoupling
        run: node --conditions=react-server --import tsx --test --test-concurrency=1 src/lib/memory/memory-episodic-ownership.test.ts

      - name: Assistant regen scope rebuild
        run: node --conditions=react-server --import tsx --test --test-concurrency=1 src/lib/memory/memory-regen-scope.test.ts

      - name: Memory premerge blockers (source-mutation invalidation)
        run: node --conditions=react-server --import tsx --test --test-concurrency=1 src/lib/memory/memory-premerge-blockers.test.ts

      - name: Memory source boundary stale guard
        run: node --conditions=react-server --import tsx --test --test-concurrency=1 src/lib/memory/memory-source-boundary.test.ts

      - name: Last-turn relationship + numeric delete atomicity
        run: node --conditions=react-server --import tsx --test --test-concurrency=1 src/lib/rpNumericStateTurnDelete.test.ts

      - name: Relationship provenance lifecycle
        run: node --conditions=react-server --import tsx --test --test-concurrency=1 src/lib/memory/memoryRelationshipTask.production.test.ts src/lib/memory/memory-relationship-provenance.test.ts

      - name: Canonical variant relationship parity
        run: node --conditions=react-server --import tsx --test --test-concurrency=1 src/lib/memory/memory-relationship-variant-switch.test.ts

      - name: Remote schema memory reachability
        run: node --conditions=react-server --import tsx --test --test-concurrency=1 src/lib/remoteSchemaMemoryReachability.test.ts

      - name: Shared initial episodic consumer regression
        run: node --conditions=react-server --import tsx --test --test-concurrency=1 src/lib/memory/memory-episodic-shared-initial.test.ts

      - name: Semantic candidate discovery regressions
        run: node --conditions=react-server --import tsx --import ./src/lib/test/regularTestEgressPolicy.ts --test --test-concurrency=1 src/lib/memory/memory-episodic-semantic-discovery.test.ts src/lib/memory/memory-episodic-semantic-cleanup.test.ts src/lib/memory/memory-episodic-semantic-synthetic.test.ts

      - name: OpenRouter embeddings transport regression
        run: node --conditions=react-server --import tsx --import ./src/lib/test/regularTestEgressPolicy.ts --test --test-concurrency=1 src/lib/openRouterEmbeddings.test.ts

      - name: Memory benchmark semantic regression
        run: node --conditions=react-server --import tsx --import ./src/lib/test/regularTestEgressPolicy.ts --test --test-concurrency=1 src/lib/memory/memory-rp-benchmark.test.ts src/lib/memory/memory-rp-benchmark-hooks.test.ts

      - name: Memory research lab (lifecycle, gates, sources, Draft PR, isolation)
        run: node --conditions=react-server --import tsx --import ./src/lib/test/regularTestEgressPolicy.ts --test --test-concurrency=1 src/lib/memoryResearch/*.test.ts

      - name: Live embedding runner isolation regression
        run: node --conditions=react-server --import tsx --import ./src/lib/test/regularTestEgressPolicy.ts --test --test-concurrency=1 scripts/lib/episodicEmbeddingLiveBenchmark.test.ts

      - name: Medium-term cascaded memory audit + reader
        run: node --conditions=react-server --import tsx --test --test-concurrency=1 src/lib/memory/memory-medium-term.test.ts src/lib/memory/memory-medium-term-audit.test.ts src/lib/memory/memory-medium-term-prompt-budget-audit.test.ts src/lib/memory/memory-prompt-injectible-parity.test.ts

      - name: Global durable checkpoint lifecycle
        run: node --conditions=react-server --import tsx --test --test-concurrency=1 src/lib/memory/memory-global-checkpoint-lifecycle.test.ts
