name: Validate user authoring policy

on:
  pull_request:
    paths:
      - "src/lib/userAuthoringPolicy.ts"
      - "src/lib/userAuthoringPolicy.test.ts"
      - "src/lib/userCoauthor*.ts"
      - "src/lib/chatRuntimeMode.ts"
      - "src/lib/corePrompt.ts"
      - "src/lib/staticSystemRulesCanon.ts"
      - "src/lib/openRouterAdult.ts"
      - "src/lib/chatForkCreate.ts"
      - "src/lib/db.ts"
      - "src/lib/currentTurnUserAuthoringDelegation*.ts"
      - "src/lib/currentUserInputLabel*.ts"
      - "src/lib/noGodmodding.ts"
      - "src/lib/autoProgressionRules.ts"
      - "src/lib/autoProgression.prompt.test.ts"
      - "src/lib/continueNarrative.ts"
      - "src/lib/continueNarrative.autoContinue.test.ts"
      - "src/lib/continueNarrative.regenerate.test.ts"
      - "src/lib/sceneDirective.ts"
      - "src/services/contextBuilder.ts"
      - "src/app/api/chat/route.ts"
      - "src/app/api/chat/settings/route.ts"
      - "src/app/api/chat/fork/route.ts"
      - "src/app/chat/**/ChatClient.tsx"
      - "src/app/chat/**/page.tsx"
      - "src/components/ChatSettingsPanel.tsx"
      - ".github/workflows/validate-user-authoring.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck:app
      - run: node --conditions=react-server --import tsx --test src/lib/userAuthoringPolicy.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/userCoauthor.h44.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/userCoauthor.authority.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/currentTurnUserAuthoringDelegation.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/currentUserInputLabel.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/autoProgression.prompt.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/continueNarrative.autoContinue.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/continueNarrative.regenerate.test.ts
