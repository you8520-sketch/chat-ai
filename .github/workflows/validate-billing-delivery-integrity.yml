name: Validate billing delivery integrity

on:
  pull_request:
    paths:
      - ".github/workflows/validate-billing-delivery-integrity.yml"
      - "src/lib/chatBillingSettlement.ts"
      - "src/lib/chatBillingSettlement.test.ts"
      - "src/lib/chatBillingDeliveryIntegrity.test.ts"
      - "src/lib/streamingPersistence.ts"
      - "src/lib/chatStreamEofReconcile.ts"
      - "src/lib/rpDerivedStateLifecycle.ts"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REGULAR_TEST_REAL_PROVIDER_CALLS: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: git diff --check

      - run: npm run lint

      - run: npm run typecheck:app

      - name: Billing delivery integrity fixtures (D1-D14)
        run: node --conditions=react-server --import tsx --test src/lib/chatBillingDeliveryIntegrity.test.ts

      - name: Chat billing settlement exactly-once
        run: node --conditions=react-server --import tsx --test src/lib/chatBillingSettlement.test.ts

      - name: Stored turn charge evidence
        run: node --conditions=react-server --import tsx --test src/lib/storedTurnChargeEvidence.test.ts

      - name: Chat stream terminalization
        run: node --conditions=react-server --import tsx --test src/lib/chatStreamTerminalization.test.ts
