name: Validate active Main RP quality qualification

on:
  schedule:
    # Monthly bounded memory-continuity evidence: 4th day 04:17 UTC (13:17 KST).
    - cron: "17 4 4 * *"
  pull_request:
    paths:
      - "scripts/lib/rpModelQualificationFixture.ts"
      - "scripts/lib/rpActiveModelQualityLive.ts"
      - "scripts/lib/rpActiveModelQualityLive.test.ts"
      - "scripts/rp-active-model-quality-live.ts"
      - "src/lib/rpQualityBaseline.ts"
      - "src/lib/rpQualityBaseline.test.ts"
      - "src/lib/rpQualityEvaluationPacket.ts"
      - "src/lib/chatDisplayLength.ts"
      - "src/lib/responseLengthConstants.ts"
      - "src/lib/userAuthoringPolicy.ts"
      - ".github/workflows/validate-rp-active-model-quality.yml"
      - ".github/rp-active-model-quality-live.trigger"

permissions:
  contents: read

concurrency:
  group: rp-active-model-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REGULAR_TEST_REAL_PROVIDER_CALLS: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck app
        run: npm run typecheck:app
      - name: Qualification deterministic regressions
        run: >-
          node --conditions=react-server --import tsx
          --import ./src/lib/test/regularTestEgressPolicy.ts
          --test --test-concurrency=1
          scripts/lib/rpModelQualificationPacket.test.ts
          scripts/lib/rpActiveModelQualityLive.test.ts
      - name: Product quality baseline regressions
        run: >-
          node --conditions=react-server --import tsx
          --import ./src/lib/test/regularTestEgressPolicy.ts
          --test src/lib/rpQualityBaseline.test.ts

  live_evidence:
    needs: deterministic
    if: >-
      github.event_name == 'schedule' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REGULAR_TEST_REAL_PROVIDER_CALLS: "1"
      RP_ACTIVE_MODEL_QUALITY_LIVE: "1"
      CHEAPER_INFERENCE_BENCHMARK_API_KEY: ${{ secrets.CHEAPER_INFERENCE_BENCHMARK_API_KEY }}
      OPENROUTER_SUPPLY_BENCHMARK_API_KEY: ${{ secrets.OPENROUTER_SUPPLY_BENCHMARK_API_KEY }}
      OPENROUTER_API_KEY: ""
      RP_ACTIVE_MODEL_QUALITY_OUTPUT_DIR: artifacts/rp-active-model-quality
    steps:
      - uses: actions/checkout@v5

      - name: Resolve bounded live-evidence trigger
        id: trigger
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "run_live=1" >> "$GITHUB_OUTPUT"
            echo "RP_ACTIVE_MODEL_QUALITY_CASE_IDS=memory_current_state_priority,memory_false_shared_event" >> "$GITHUB_ENV"
            echo "Monthly schedule: two memory-continuity cases across the current active Main-RP registry."
          elif [[ -f .github/rp-active-model-quality-live.trigger ]]; then
            echo "run_live=1" >> "$GITHUB_OUTPUT"
            case_ids="$(sed -n 's/^case_ids=//p' .github/rp-active-model-quality-live.trigger | tail -n 1)"
            model_ids="$(sed -n 's/^model_ids=//p' .github/rp-active-model-quality-live.trigger | tail -n 1)"
            if [[ -n "$case_ids" ]]; then
              echo "RP_ACTIVE_MODEL_QUALITY_CASE_IDS=$case_ids" >> "$GITHUB_ENV"
            fi
            if [[ -n "$model_ids" ]]; then
              echo "RP_ACTIVE_MODEL_QUALITY_MODEL_IDS_OVERRIDE=$model_ids" >> "$GITHUB_ENV"
            fi
          else
            echo "run_live=0" >> "$GITHUB_OUTPUT"
            echo "PR trigger absent; provider calls=0."
          fi

      - name: Require dedicated benchmark credential
        if: steps.trigger.outputs.run_live == '1'
        shell: bash
        run: |
          if [[ -z "$CHEAPER_INFERENCE_BENCHMARK_API_KEY" ]]; then
            echo "::error::CHEAPER_INFERENCE_BENCHMARK_API_KEY repository secret is required."
            exit 2
          fi
          if [[ -z "$OPENROUTER_SUPPLY_BENCHMARK_API_KEY" ]]; then
            echo "::error::OPENROUTER_SUPPLY_BENCHMARK_API_KEY repository secret is required."
            exit 2
          fi

      - uses: actions/setup-node@v5
        if: steps.trigger.outputs.run_live == '1'
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.trigger.outputs.run_live == '1'
        run: npm ci

      - name: Run bounded active-model live evidence
        if: steps.trigger.outputs.run_live == '1'
        run: >-
          node --conditions=react-server --import tsx
          --import ./src/lib/test/regularTestEgressPolicy.ts
          scripts/rp-active-model-quality-live.ts

      - name: Job summary
        if: steps.trigger.outputs.run_live == '1' && always()
        shell: bash
        run: |
          if [[ -f artifacts/rp-active-model-quality/REPORT.md ]]; then
            cat artifacts/rp-active-model-quality/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload raw quality evidence
        if: steps.trigger.outputs.run_live == '1' && always()
        uses: actions/upload-artifact@v6
        with:
          name: rp-active-model-quality-evidence
          path: artifacts/rp-active-model-quality
          if-no-files-found: error
          retention-days: 90
