name: Validate scheduler durability

on:
  pull_request:
    paths:
      - "server.js"
      - "src/cron/financeScheduler.ts"
      - "src/cron/payoutScheduler.ts"
      - "src/cron/trainingScheduler.ts"
      - "src/cron/mainRpCacheTtlAuditScheduler.ts"
      - "src/lib/schedulerDefinitions.ts"
      - "src/lib/schedulerRunRegistry.ts"
      - "src/lib/schedulerRunRegistry.test.ts"
      - "src/lib/schedulerRunShared.ts"
      - "src/lib/mainRpCacheTtlEconomics.ts"
      - "src/lib/mainRpCacheTtlEconomics.test.ts"
      - "src/lib/adminAutomationReports.ts"
      - "src/lib/adminAutomationReports.test.ts"
      - "src/app/admin/automation-reports/page.tsx"
      - "src/app/settings/SettingsClient.tsx"
      - "src/lib/payoutSchedule.ts"
      - "src/lib/adminFinance.ts"
      - "src/lib/db.ts"
      - "src/app/admin/finance/page.tsx"
      - "src/app/admin/finance/AdminFinanceClient.tsx"
      - ".github/workflows/validate-scheduler-durability.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SESSION_SECRET: "01234567890123456789012345678901"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Diff hygiene
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - name: App typecheck
        run: npm run typecheck:app
      - name: Durable scheduler + automation report regressions
        run: >-
          node --conditions=react-server --import tsx --test --test-concurrency=1
          src/lib/schedulerRunRegistry.test.ts
          src/lib/mainRpCacheTtlEconomics.test.ts
          src/lib/adminAutomationReports.test.ts
      - name: Production build
        run: npm run build
