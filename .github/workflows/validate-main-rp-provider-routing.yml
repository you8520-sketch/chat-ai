name: Validate Main RP provider routing

on:
  pull_request:
    paths:
      - "src/lib/chatModels.ts"
      - "src/lib/openRouterConfig.ts"
      - "src/lib/openRouterClient.ts"
      - "src/lib/openRouterAdult.ts"
      - "src/app/api/chat/route.ts"
      - "src/lib/publishedModelAliases.ts"
      - "src/lib/publishedModelPricing.ts"
      - "src/lib/modelPublishedPricingPolicy.ts"
      - "src/lib/chatBillingContractDispatch.ts"
      - "scripts/lib/mainRpMonthlyCacheAudit.ts"
      - "scripts/lib/mainRpSupplyRadar.ts"
      - "scripts/lib/mainRpSupplyLiveQualification.ts"
      - "scripts/lib/mainRpSupplyAutoDraft.ts"
      - "scripts/main-rp-supply-auto-draft.ts"
      - "scripts/main-rp-supply-route-assert.ts"
      - "scripts/lib/mainRpSupplyCurrentBaseline.ts"
      - "scripts/lib/compatibleSupplyProbe.ts"
      - "scripts/lib/fluenceProviderQualification.ts"
      - "scripts/fluence-provider-qualification.ts"
      - "scripts/lib/fluenceProviderQualification.test.ts"
      - "src/lib/test/regularTestEgressPolicy.ts"
      - "scripts/lib/rpModelQualificationPacket.ts"
      - "**/*mainRp*test.ts"
      - "src/lib/chatModels.gemini.test.ts"
      - "src/lib/openRouterClient.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHEAPER_INFERENCE_API_KEY: ""
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      REGULAR_TEST_REAL_PROVIDER_CALLS: "0"
      MAIN_RP_SUPPLY_LIVE_QUALIFICATION: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck:app
      - name: Main RP provider and model registry
        run: >-
          node --conditions=react-server --import tsx --test --test-concurrency=1
          src/lib/chatModels.gemini.test.ts
          src/lib/mainRpModelRegistry.test.ts
          src/lib/openRouterClient.test.ts
      - name: Published pricing routing compatibility
        run: >-
          node --conditions=react-server --import tsx --test --test-concurrency=1
          src/lib/publishedModelPricing.test.ts
          src/lib/chatBillingContractDispatch.test.ts
      - name: Main RP qualification packet
        run: node --conditions=react-server --import tsx scripts/lib/rpModelQualificationPacket.test.ts
      - name: Fluence qualification contract (offline only)
        run: >-
          node --conditions=react-server --import tsx
          --import ./src/lib/test/regularTestEgressPolicy.ts
          --test --test-concurrency=1 scripts/lib/fluenceProviderQualification.test.ts
      - name: Main RP cache and supply deterministic regressions
        run: >-
          node --conditions=react-server --import tsx --test --test-concurrency=1
          scripts/lib/mainRpMonthlyCacheAudit.test.ts
          scripts/lib/mainRpSupplyRadar.test.ts
          scripts/lib/mainRpDirectSupplierRadar.test.ts
          scripts/lib/mainRpSupplyPromotionHistory.test.ts
          scripts/lib/mainRpSupplyPromotionProposal.test.ts
          scripts/lib/mainRpSupplyAutoDraft.test.ts
          scripts/lib/mainRpSupplyLiveQualification.test.ts
          scripts/lib/mainRpSupplyCurrentBaseline.test.ts
