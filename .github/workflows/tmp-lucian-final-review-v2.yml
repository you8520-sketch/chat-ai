name: TEMP Lucian final review v2

on:
  push:
    branches:
      - tmp/lucian-review-final-v2

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile exact Lucian review packet
        env:
          OFFICIAL_REVIEW_DRAFT_JSON_PATH: /tmp/lucian-draft.json
        run: npm run official-supply:review-character -- pilot-rf-03 /tmp/lucian-review.md
      - uses: actions/upload-artifact@v4
        with:
          name: lucian-final-review-v2
          path: |
            /tmp/lucian-review.md
            /tmp/lucian-draft.json
          if-no-files-found: error
          retention-days: 1
