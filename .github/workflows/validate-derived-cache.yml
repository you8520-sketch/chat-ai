name: Validate derived cache (PR-2)

on:
  pull_request:
    paths:
      - "src/lib/derivedCache/**"
      - "src/lib/characterChunks.ts"
      - "src/lib/characterFormSave.ts"
      - "src/lib/promptTranslation.ts"
      - "src/lib/promptTranslation.test.ts"
      - "src/lib/appearanceCompiler.ts"
      - "src/lib/worldShares.borrow.test.ts"
      - "src/components/studioWorldActions.regression.test.ts"
      - "scripts/bench-luna-vs-gemini31-flash-lite.ts"
      - "scripts/bench-pr2-translation-ab.ts"
      - "scripts/bench-pr2-translation-ab.failure-resilience.test.ts"
      - "scripts/lib/pr2TranslationAbHarness.ts"
      - ".github/workflows/validate-derived-cache.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REGULAR_TEST_REAL_PROVIDER_CALLS: "0"
      DISABLE_DERIVED_CACHE_WORKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck:app
      - run: npx tsx scripts/bench-pr2-translation-ab.ts
      - run: npx tsx scripts/bench-luna-vs-gemini31-flash-lite.ts
      - run: node --conditions=react-server --import tsx --test scripts/bench-pr2-translation-ab.failure-resilience.test.ts
      - run: node --conditions=react-server --import tsx --test --test-concurrency=1 src/lib/derivedCache/derivedCache.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/promptTranslation.test.ts
      - run: node --conditions=react-server --import tsx --test --test-concurrency=1 src/lib/worldShares.borrow.test.ts
      - run: node --import tsx --test src/components/studioWorldActions.regression.test.ts
