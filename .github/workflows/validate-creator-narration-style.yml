name: Validate creator narration style (PR-3)

on:
  pull_request:
    paths:
      - "src/lib/creatorNarrationStyle.ts"
      - "src/lib/creatorNarrationStyle*.test.ts"
      - "src/lib/assetManagerGridSelection.ts"
      - "src/lib/characterFormSave.ts"
      - "src/lib/characterCreateDraft.ts"
      - "src/lib/db.ts"
      - "src/components/CreateCharacter.tsx"
      - "src/components/AssetManagerGrid.tsx"
      - "src/components/AssetManagerGrid.selection.test.ts"
      - "src/services/contextBuilder.ts"
      - "src/services/contextBuilder.creatorNarrationStyle.test.ts"
      - "src/app/api/characters/**"
      - "src/app/api/chat/route.ts"
      - "src/types.ts"
      - ".github/workflows/validate-creator-narration-style.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REGULAR_TEST_REAL_PROVIDER_CALLS: "0"
      DISABLE_DERIVED_CACHE_WORKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck:app
      - run: node --conditions=react-server --import tsx --test src/lib/creatorNarrationStyle.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/creatorNarrationStyle.integration.test.ts
      - run: node --conditions=react-server --import tsx --test src/services/contextBuilder.creatorNarrationStyle.test.ts
      - run: node --import tsx --test src/components/AssetManagerGrid.selection.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/promptTranslation.test.ts
      - run: node --conditions=react-server --import tsx --test --test-concurrency=1 src/lib/derivedCache/derivedCache.test.ts
      - run: node --conditions=react-server --import tsx --test --test-concurrency=1 src/lib/worldShares.borrow.test.ts
      - run: node --import tsx --test src/components/studioWorldActions.regression.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/simulationVisualSubjects.test.ts
