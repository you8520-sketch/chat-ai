name: Validate completion-integrity JEV benchmark

# Deterministic CI for Main RP completion-integrity lexical→JEV shadow benchmark.
# Live provider calls remain opt-in only (REGULAR_TEST_REAL_PROVIDER_CALLS=0 here).

on:
  pull_request:
    paths:
      - ".github/workflows/validate-completion-integrity-jev.yml"
      - "src/lib/responseLength.ts"
      - "src/lib/responseLength.recovery.test.ts"
      - "src/lib/sentenceCompletionRecovery.ts"
      - "src/lib/sentenceCompletionRecovery.test.ts"
      - "src/lib/completionIntegrityCorpus.ts"
      - "src/lib/completionIntegrityCandidate.ts"
      - "src/lib/completionIntegrityJevJudge.ts"
      - "src/lib/jevDecisions.ts"
      - "src/lib/jevDecisions.test.ts"
      - "scripts/lib/benchmarkOpenRouterJevCredential.ts"
      - "scripts/lib/completionIntegrityJevBenchmark.ts"
      - "scripts/lib/completionIntegrityJevBenchmark.test.ts"
      - "scripts/benchmark-completion-integrity-jev-live.ts"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REGULAR_TEST_REAL_PROVIDER_CALLS: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: git diff --check

      - run: npm run lint

      - run: npm run typecheck:app

      - name: Response length + sentence completion regressions
        run: >
          node --conditions=react-server --import tsx
          --import ./src/lib/test/regularTestEgressPolicy.ts
          --test --test-concurrency=1
          src/lib/responseLength.recovery.test.ts
          src/lib/sentenceCompletionRecovery.test.ts

      - name: JEV decisions transport regression
        run: >
          node --conditions=react-server --import tsx
          --import ./src/lib/test/regularTestEgressPolicy.ts
          --test --test-concurrency=1
          src/lib/jevDecisions.test.ts

      - name: Completion-integrity JEV benchmark isolation
        run: >
          node --conditions=react-server --import tsx
          --import ./src/lib/test/regularTestEgressPolicy.ts
          --test --test-concurrency=1
          scripts/lib/completionIntegrityJevBenchmark.test.ts

      - name: Chat billing delivery integrity remains green
        run: >
          node --conditions=react-server --import tsx
          --import ./src/lib/test/regularTestEgressPolicy.ts
          --test --test-concurrency=1
          src/lib/chatBillingDeliveryIntegrity.test.ts
