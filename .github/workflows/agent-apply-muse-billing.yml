name: Apply Muse billing fix

on:
  push:
    branches:
      - agent/fix-muse-billing-60-margin
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply deterministic source edits
        run: python3 .agent/apply-muse-billing.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused billing tests
        run: |
          set +e
          npx tsx --test src/lib/openRouterUsage.test.ts src/lib/points.muse.test.ts > .agent/test-failure.log 2>&1
          status=$?
          set -e
          cat .agent/test-failure.log
          if [ "$status" -ne 0 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/lib/points.ts src/lib/openRouterUsage.ts src/lib/openRouterUsage.test.ts src/lib/points.muse.test.ts .agent/test-failure.log
            git commit -m 'chore: capture Muse billing test failure'
            git push origin HEAD:agent/fix-muse-billing-60-margin
            exit "$status"
          fi

      - name: Typecheck app
        run: npm run typecheck:app

      - name: Commit validated changes
        run: |
          rm -f .agent/muse-billing-60.patch .agent/muse-billing-rate-only.patch .agent/apply-muse-billing.py .agent/apply-check.log .agent/test-failure.log
          rmdir .agent 2>/dev/null || true
          rm -f .github/workflows/agent-apply-muse-billing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(billing): charge full Muse usage at 60% margin'
          git push origin HEAD:agent/fix-muse-billing-60-margin
