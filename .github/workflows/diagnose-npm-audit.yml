name: Diagnose npm audit

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/diagnose-npm-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: npm audit JSON
        shell: bash
        run: |
          set +e
          npm audit --json
          code=$?
          echo "npm_audit_exit_code=$code"
          exit 0
