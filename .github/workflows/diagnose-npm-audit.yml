name: Diagnose npm audit

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/diagnose-npm-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SESSION_SECRET: "01234567890123456789012345678901"
      WITHDRAWAL_ENCRYPTION_KEY: "01234567890123456789012345678901"
      DISABLE_PAYOUT_SCHEDULER: "1"
      DISABLE_FINANCE_SCHEDULER: "1"
      DISABLE_DERIVED_CACHE_WORKER: "1"
      REGULAR_TEST_REAL_PROVIDER_CALLS: "0"
      DISABLE_WEB_PUSH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Dependency tree
        shell: bash
        run: |
          npm ls esbuild nanoid postcss next --all || true
          echo "--- next@15.5.24 dependencies ---"
          npm view next@15.5.24 dependencies --json
          echo "--- package versions ---"
          node - <<'NODE'
          for (const name of ["next","postcss","nanoid","esbuild"]) {
            try {
              console.log(name, require(name + "/package.json").version)
            } catch (error) {
              console.log(name, "not-resolvable-from-root")
            }
          }
          NODE

      - name: npm audit JSON
        shell: bash
        run: |
          set +e
          npm audit --json
          code=$?
          echo "npm_audit_exit_code=$code"
          exit 0

      - name: Test minimal fixed-version overrides
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs")
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"))
          pkg.overrides = {
            ...(pkg.overrides || {}),
            esbuild: "0.28.1",
            nanoid: "3.3.18",
            postcss: "8.5.23"
          }
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n")
          NODE
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm ls esbuild nanoid postcss next --all || true
          set +e
          npm audit --json
          audit_code=$?
          set -e
          echo "candidate_audit_exit_code=$audit_code"
          npm run typecheck:app
          npm run build
