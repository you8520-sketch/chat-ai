name: Apply npm security lockfile

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/diagnose-npm-audit.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SESSION_SECRET: "01234567890123456789012345678901"
      WITHDRAWAL_ENCRYPTION_KEY: "01234567890123456789012345678901"
      DISABLE_PAYOUT_SCHEDULER: "1"
      DISABLE_FINANCE_SCHEDULER: "1"
      DISABLE_DERIVED_CACHE_WORKER: "1"
      REGULAR_TEST_REAL_PROVIDER_CALLS: "0"
      DISABLE_WEB_PUSH: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Regenerate lockfile from reviewed overrides
        run: npm install --package-lock-only --ignore-scripts

      - run: npm ci

      - name: Verify exact patched dependency tree
        run: |
          npm ls esbuild nanoid postcss next --all
          node - <<'NODE'
          const versions = {
            esbuild: require("esbuild/package.json").version,
            nanoid: require("nanoid/package.json").version,
            postcss: require("postcss/package.json").version,
            next: require("next/package.json").version,
          }
          console.log(versions)
          if (versions.esbuild !== "0.28.1") process.exit(2)
          if (versions.nanoid !== "3.3.18") process.exit(3)
          if (versions.postcss !== "8.5.23") process.exit(4)
          if (versions.next !== "15.5.25") process.exit(5)
          NODE

      - name: Require zero npm audit findings
        shell: bash
        run: |
          npm audit --json > /tmp/audit.json
          node - <<'NODE'
          const report = require("/tmp/audit.json")
          if (report.metadata?.vulnerabilities?.total !== 0) {
            console.error(report.metadata?.vulnerabilities)
            process.exit(6)
          }
          console.log(report.metadata.vulnerabilities)
          NODE

      - run: npm run typecheck:app
      - run: npm run build

      - name: Commit regenerated package-lock only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock already current"
            exit 0
          fi
          git commit -m "fix(security): refresh lockfile for patched transitive dependencies"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
