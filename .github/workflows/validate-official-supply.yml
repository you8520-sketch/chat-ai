name: Validate official supply

on:
  pull_request:
    paths:
      - "src/lib/officialSupply/**"
      - "scripts/official-supply-*.ts"
      - "public/official-supply/**"
      - "package.json"
      - ".github/workflows/validate-official-supply.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SESSION_SECRET: "01234567890123456789012345678901"
      WITHDRAWAL_ENCRYPTION_KEY: "01234567890123456789012345678901"
      REGULAR_TEST_REAL_PROVIDER_CALLS: "0"
      DISABLE_WEB_PUSH: "1"
      DISABLE_PAYOUT_SCHEDULER: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - run: npm run lint
      - run: npm run typecheck:app

      - name: Proof operator defaults to zero calls
        run: npm run official-supply:style-proof

      - name: Anchor operator defaults to zero calls
        run: npm run official-supply:generate-rofan-v4-anchors

      - name: Anchor approval operator defaults to zero mutations
        run: npm run official-supply:approve-anchor

      - name: Lucian variation operator defaults to zero calls
        run: npm run official-supply:generate-lucian-variations

      - name: Fetch Lucian v4 visual QA packet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/lucian-v4
          base="https://chat-ai-production-3e84.up.railway.app/uploads"
          for slot in rep sig1 sig2 sig3 sig4 emo1 emo2 emo3 emo4 emo5 emo6 scene1 scene2 scene3; do
            curl --fail --location --silent --show-error               "$base/official-pilot-rf-v4-03__${slot}-a1.webp"               --output "qa/lucian-v4/${slot}.webp"
            test -s "qa/lucian-v4/${slot}.webp"
          done

      - name: Upload Lucian v4 visual QA packet
        uses: actions/upload-artifact@v4
        with:
          name: lucian-v4-visual-qa
          path: qa/lucian-v4/*.webp
          if-no-files-found: error
          retention-days: 1

      - name: Official supply regressions
        run: >-
          node --conditions=react-server --import tsx
          --import ./src/lib/test/regularTestEgressPolicy.ts
          --test --test-concurrency=1
          src/lib/officialSupply/*.test.ts
