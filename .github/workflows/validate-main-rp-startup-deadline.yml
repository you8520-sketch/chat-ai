name: Validate Main RP startup deadline

on:
  pull_request:
    paths:
      - "src/lib/deepseekProviderFailover.ts"
      - "src/lib/deepseekProviderFailover*.test.ts"
      - "src/lib/mainRpStartupDeadline.test.ts"
      - "src/lib/mainRpStrictFailure.test.ts"
      - "src/lib/gemini37AdultHandoffContract.test.ts"
      - "src/app/api/chat/route.ts"
      - "src/cron/financeScheduler.ts"
      - "src/cron/payoutScheduler.ts"
      - "src/cron/trainingScheduler.ts"
      - "src/lib/schedulerDefinitions.ts"
      - "src/lib/schedulerRunRegistry.ts"
      - "src/lib/schedulerRunRegistry.test.ts"
      - "src/lib/schedulerRunShared.ts"
      - "src/lib/payoutSchedule.ts"
      - "src/lib/db.ts"
      - "src/app/admin/finance/page.tsx"
      - "src/app/admin/finance/AdminFinanceClient.tsx"
      - ".github/workflows/validate-main-rp-startup-deadline.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SESSION_SECRET: "01234567890123456789012345678901"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - run: npm run typecheck:app
      - run: node --conditions=react-server --import tsx --test src/lib/schedulerRunRegistry.test.ts
      - run: npm run build
      - run: node --conditions=react-server --import tsx --test src/lib/mainRpStartupDeadline.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/deepseekProviderFailover.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/mainRpStrictFailure.test.ts
