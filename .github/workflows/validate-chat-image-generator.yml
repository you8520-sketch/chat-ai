      - "src/app/trpg/[id]/page.tsx"
      - "src/app/trpg/[id]/TrpgRoomClient.tsx"
      - "src/app/trpg/TrpgCampaignRoom.tsx"
      - "public/image-templates/**"
      - ".github/workflows/validate-chat-image-generator.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck:app
      - run: node --conditions=react-server --import tsx --test src/lib/chatImageGenerationPersistence.test.ts
      - run: node --import tsx --test src/lib/chatImageGenerationPersistence.regression.test.ts
      - run: node --import tsx --test src/lib/chatImageGeneration.test.ts
      - run: node --import tsx --test src/lib/chatComicGeneration.test.ts
      - run: node --import tsx --test src/lib/chatComicPanelSpec.test.ts
      - run: node --import tsx --test src/lib/chatCoupleStampGeneration.test.ts
      - run: node --import tsx --test src/lib/chatLdIllustrationGeneration.test.ts
      - run: node --import tsx --test src/lib/chatEmoticonGeneration.test.ts
      - run: node --import tsx --test src/lib/chatImageVisualIdentity.test.ts
      - run: node --import tsx --test src/lib/chatImageComposition.test.ts
      - run: node --import tsx --test src/lib/chatImageEyeTraits.test.ts
      - run: node --import tsx --test src/lib/chatImageSceneBrief.test.ts
      - run: node --import tsx --test src/lib/chatImageScenePlan.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/chatImageMultiSpeakerDialogue.test.ts
      - run: node --import tsx --test src/lib/chatImageComicDialogueRegression.test.ts
      - run: node --import tsx --test src/lib/chatImageScenePreviewProjection.test.ts
      - run: node --import tsx --test src/lib/chatImageSceneDialogueEditor.test.ts
      - run: node --import tsx --test src/lib/chatImageDialogueKeystroke.test.ts
      - run: node --import tsx --test src/lib/chatImageAttributionBoundary.test.ts
      - run: node --import tsx --test src/lib/chatImageScenePlanLifecycle.test.ts
      - run: node --import tsx --test src/lib/chatComicPanelSpecSemantics.test.ts
      - run: node --import tsx --test src/lib/chatImagePromptIdentityBinding.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/chatImageSceneSourceLifecycle.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/chatImageSceneManualFirst.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/chatImageSimulationCast.test.ts
      - run: node --import tsx --test src/lib/simulationVisualSubjects.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/simulationVisualSubjectsSave.test.ts
      - run: node --import tsx --test src/lib/visualSubjects.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/characterVisualSubjects.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/characterVisualSubjectsSave.test.ts
      - run: node --import tsx --test src/lib/chatImageCharacterSupportCast.test.ts
      - run: node --import tsx --test src/lib/chatImageClientPrivacy.test.ts
      - run: node --import tsx --test src/lib/chatImageServerVisualScope.test.ts
      - run: node --import tsx --test src/lib/chatImageSceneVisualScope.test.ts
      - run: node --import tsx --test src/lib/simulationMode.test.ts
      - run: node --import tsx --test src/lib/simulationCreatorUx.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/simulationCreatorAssetBoundary.test.ts
      - run: node --import tsx --test src/lib/characterAssets.test.ts
      - run: node --import tsx --test src/lib/assetVisionStructured.test.ts
