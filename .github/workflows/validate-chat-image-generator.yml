name: Validate chat image generator

on:
  pull_request:
    paths:
      - "src/app/api/chat/image-generation/**"
      - "src/app/api/chat/comic-generation/**"
      - "src/app/api/chat/image-album/**"
      - "src/components/ChatAssetAlbumModal.tsx"
      - "src/components/ChatImageGeneratorPanel.tsx"
      - "src/components/ChatImageGeneratorRailButton.tsx"
      - "src/components/ChatRoomDisplayQuickRail.tsx"
      - "src/components/MessageBubbleToolbar.tsx"
      - "src/components/ChatToolbarIcons.tsx"
      - "src/lib/chatImageGeneration.ts"
      - "src/lib/chatImageGeneration.test.ts"
      - "src/lib/chatComicGeneration.ts"
      - "src/lib/chatComicGeneration.test.ts"
      - "src/lib/chatCoupleStampGeneration.ts"
      - "src/lib/chatCoupleStampGeneration.test.ts"
      - "src/lib/chatLdIllustrationGeneration.ts"
      - "src/lib/chatLdIllustrationGeneration.test.ts"
      - "src/lib/chatEmoticonGeneration.ts"
      - "src/lib/chatEmoticonGeneration.test.ts"
      - "src/lib/chatImageVisualIdentity.ts"
      - "src/lib/chatImageVisualIdentity.test.ts"
      - "src/lib/chatImageVisualIdentity.fixtures.ts"
      - "src/lib/chatImageComposition.ts"
      - "src/lib/chatImageComposition.test.ts"
      - "src/lib/chatImageEyeTraits.ts"
      - "src/lib/chatImageEyeTraits.test.ts"
      - "src/lib/chatImageSceneBrief.ts"
      - "src/lib/chatImageSceneBrief.test.ts"
      - "src/lib/chatImageScenePlan.ts"
      - "src/lib/chatImageScenePlan.test.ts"
      - "src/lib/chatImageScenePlanRateLimit.ts"
      - "src/lib/chatImageSceneManualFirst.test.ts"
      - "src/lib/chatImageSimulationCast.test.ts"
      - "src/lib/chatImageScenePlanner.ts"
      - "src/lib/chatImageScenePlanner.test.ts"
      - "src/lib/chatImageCast.ts"
      - "src/lib/chatImageCastManifest.ts"
      - "src/lib/simulationVisualSubjects.ts"
      - "src/lib/simulationVisualSubjects.test.ts"
      - "src/lib/simulationVisualSubjectsSave.test.ts"
      - "src/lib/visualSubjects.ts"
      - "src/lib/visualSubjects.test.ts"
      - "src/lib/characterVisualSubjects.ts"
      - "src/lib/characterVisualSubjects.test.ts"
      - "src/lib/characterVisualSubjectsSave.test.ts"
      - "src/lib/chatImageCharacterSupportCast.test.ts"
      - "src/lib/chatImageClientPrivacy.test.ts"
      - "src/lib/characterAssets.ts"
      - "src/lib/characterAssets.test.ts"
      - "src/lib/characterFormSave.ts"
      - "src/lib/db.ts"
      - "src/components/AssetManagerGrid.tsx"
      - "src/components/CreateCharacter.tsx"
      - "src/lib/simulationMode.ts"
      - "src/lib/simulationMode.test.ts"
      - "src/lib/simulationCreatorUx.test.ts"
      - "src/lib/simulationCreatorAssetBoundary.test.ts"
      - "src/app/api/characters/[id]/route.ts"
      - "src/lib/chatImageCastManifest.test.ts"
      - "src/lib/chatImageCast.clientBoundary.test.ts"
      - "src/components/ChatImageCastPicker.tsx"
      - "src/components/ChatSceneBuilder.tsx"
      - "src/lib/openAiImageEdit.ts"
      - "src/lib/openAiImageEdit.test.ts"
      - "src/lib/trpg/illustrationCast.ts"
      - "public/image-templates/**"
      - ".github/workflows/validate-chat-image-generator.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck:app
      - run: node --import tsx --test src/lib/chatImageGeneration.test.ts
      - run: node --import tsx --test src/lib/chatComicGeneration.test.ts
      - run: node --import tsx --test src/lib/chatCoupleStampGeneration.test.ts
      - run: node --import tsx --test src/lib/chatLdIllustrationGeneration.test.ts
      - run: node --import tsx --test src/lib/chatEmoticonGeneration.test.ts
      - run: node --import tsx --test src/lib/chatImageVisualIdentity.test.ts
      - run: node --import tsx --test src/lib/chatImageComposition.test.ts
      - run: node --import tsx --test src/lib/chatImageEyeTraits.test.ts
      - run: node --import tsx --test src/lib/chatImageSceneBrief.test.ts
      - run: node --import tsx --test src/lib/chatImageScenePlan.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/chatImageSceneManualFirst.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/chatImageSimulationCast.test.ts
      - run: node --import tsx --test src/lib/simulationVisualSubjects.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/simulationVisualSubjectsSave.test.ts
      - run: node --import tsx --test src/lib/visualSubjects.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/characterVisualSubjects.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/characterVisualSubjectsSave.test.ts
      - run: node --import tsx --test src/lib/chatImageCharacterSupportCast.test.ts
      - run: node --import tsx --test src/lib/chatImageClientPrivacy.test.ts
      - run: node --import tsx --test src/lib/simulationMode.test.ts
      - run: node --import tsx --test src/lib/simulationCreatorUx.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/simulationCreatorAssetBoundary.test.ts
      - run: node --import tsx --test src/lib/characterAssets.test.ts
      - run: node --conditions=react-server --import tsx --test src/lib/chatImageScenePlanner.test.ts
      - run: node --import tsx --test src/lib/chatImageCastManifest.test.ts
      - run: node --import tsx --test src/lib/chatImageCast.clientBoundary.test.ts
      - run: node --import tsx --test src/lib/openAiImageEdit.test.ts
