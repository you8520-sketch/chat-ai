name: Main RP supply radar

on:
  schedule:
    # 01st day: full monthly scan + bounded live qualification.
    - cron: "47 3 1 * *"
    # 08th/15th/22nd: read-only procurement/price/health snapshots.
    # Together with the 01st run this yields four durable market snapshots/month
    # without increasing provider-generation calls.
    - cron: "47 3 8,15,22 * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/main-rp-supply-radar.yml"

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: main-rp-monthly-supply-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REGULAR_TEST_REAL_PROVIDER_CALLS: "0"
      OPENROUTER_SUPPLY_RADAR_API_KEY: ${{ secrets.OPENROUTER_SUPPLY_RADAR_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CHEAPER_INFERENCE_USAGE_API_KEY: ${{ secrets.CHEAPER_INFERENCE_USAGE_API_KEY }}
      CHEAPER_INFERENCE_BENCHMARK_API_KEY: ${{ secrets.CHEAPER_INFERENCE_BENCHMARK_API_KEY }}
      MAIN_RP_SUPPLY_RADAR_OUTPUT_DIR: artifacts/main-rp-supply-radar
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Supply radar deterministic regression
        run: >-
          node --conditions=react-server --import tsx --test --test-concurrency=1
          scripts/lib/mainRpSupplyRadar.test.ts
          scripts/lib/mainRpDirectSupplierRadar.test.ts
          scripts/lib/mainRpSupplyPromotionHistory.test.ts
          scripts/lib/mainRpSupplyPromotionProposal.test.ts
          scripts/lib/mainRpSupplyAutoDraft.test.ts
          scripts/lib/mainRpSupplyLiveQualification.test.ts
          scripts/lib/mainRpSupplyCurrentBaseline.test.ts
      - name: Read-only external supply scan
        run: node --conditions=react-server --import tsx scripts/main-rp-supply-radar.ts
      - name: Assert zero generation calls
        shell: bash
        run: |
          test -f artifacts/main-rp-supply-radar/report.json
          node - <<'NODE'
          const fs = require("fs");
          const r = JSON.parse(fs.readFileSync("artifacts/main-rp-supply-radar/report.json","utf8"));
          if (r.providerGenerationCalls !== 0) throw new Error("provider generation call invariant violated");
          NODE
      - name: Bounded live candidate qualification
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 3 1 * *'
        env:
          REGULAR_TEST_REAL_PROVIDER_CALLS: "1"
          MAIN_RP_SUPPLY_LIVE_QUALIFICATION: "1"
          OPENROUTER_SUPPLY_BENCHMARK_API_KEY: ${{ secrets.OPENROUTER_SUPPLY_BENCHMARK_API_KEY }}
        run: node --conditions=react-server --import tsx scripts/main-rp-supply-live-qualification.ts
      - name: Supply promotion history gate
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --conditions=react-server --import tsx scripts/main-rp-supply-promotion-history.ts
      - name: Supply promotion proposal packet
        if: always()
        run: node --conditions=react-server --import tsx scripts/main-rp-supply-promotion-proposal.ts
      - name: Inject synthetic eligible proposal for probe only
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          cat > artifacts/main-rp-supply-radar/promotion-proposals.json <<'JSON'
          {
            "version": 1,
            "generatedAt": "2026-09-30T00:00:00.000Z",
            "proposals": [
              {
                "modelId": "gemini-3.7-flash",
                "candidateProviderName": "Google Vertex",
                "candidateProviderSlug": "google-vertex",
                "currentProcurementProvider": "openrouter",
                "transitionKind": "SAME_OPENROUTER_TRANSPORT",
                "draftRoutePrEligible": true,
                "automaticMergeEligible": false,
                "stopReason": null,
                "evidence": {
                  "qualifyingMarketSnapshots": 4,
                  "marketObservationSpanDays": 21,
                  "completeLivePairs": 2,
                  "liveObservationSpanDays": 21,
                  "latestSavingsPercent": 15,
                  "worstCandidateTotalVsBaselineRatio": 0.8,
                  "worstCandidateTtftVsBaselineRatio": 0.9
                },
                "requiredReviewOwners": []
              }
            ],
            "draftRoutePrEligibleCount": 1,
            "crossProviderReviewRequiredCount": 0,
            "automaticMergeEligibleCount": 0,
            "notes": ["probe-only synthetic packet"]
          }
          JSON
      - name: Create validated provider-switch Draft PR
        if: success() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'pull_request')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAIN_RP_SUPPLY_AUTO_DRAFT_DRY_RUN: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: node --conditions=react-server --import tsx scripts/main-rp-supply-auto-draft.ts
      - name: Probe GitHub Actions Draft PR permission
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          BASE_SHA="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          BRANCH="automation/permission-probe-$GITHUB_RUN_ID"
          FILE=".github/supply-auto-draft-permission-probe.txt"
          gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$BASE_SHA" >/dev/null
          CONTENT="$(printf 'temporary GitHub Actions Draft PR permission probe\n' | base64 -w0)"
          gh api -X PUT "repos/$REPO/contents/$FILE"             -f message="test: GitHub Actions Draft PR permission probe"             -f content="$CONTENT"             -f branch="$BRANCH" >/dev/null
          PR_URL="$(gh pr create             --repo "$REPO"             --base main             --head "$BRANCH"             --draft             --title "test: GitHub Actions Draft PR permission probe"             --body "Temporary permission probe created by Main RP supply automation. Close/delete immediately.")"
          gh pr close "$PR_URL" --repo "$REPO" --delete-branch >/dev/null
      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/main-rp-supply-radar/REPORT.md ]; then
            cat artifacts/main-rp-supply-radar/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/main-rp-supply-radar/DIRECT-SUPPLIERS.md ]; then
            printf '\n---\n' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/main-rp-supply-radar/DIRECT-SUPPLIERS.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/main-rp-supply-radar/live/LIVE-QUALIFICATION.md ]; then
            printf '\n---\n' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/main-rp-supply-radar/live/LIVE-QUALIFICATION.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/main-rp-supply-radar/live/COMPARISON.md ]; then
            printf '\n---\n' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/main-rp-supply-radar/live/COMPARISON.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/main-rp-supply-radar/PROMOTION-HISTORY.md ]; then
            printf '\n---\n' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/main-rp-supply-radar/PROMOTION-HISTORY.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/main-rp-supply-radar/PROMOTION-PROPOSALS.md ]; then
            printf '\n---\n' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/main-rp-supply-radar/PROMOTION-PROPOSALS.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/main-rp-supply-radar/AUTO-DRAFT.md ]; then
            printf '\n---\n' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/main-rp-supply-radar/AUTO-DRAFT.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload supply evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: main-rp-supply-radar-${{ github.run_id }}
          path: artifacts/main-rp-supply-radar
          if-no-files-found: error
          retention-days: 365
