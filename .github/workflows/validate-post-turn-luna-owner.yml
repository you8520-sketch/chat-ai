name: Validate post-turn Luna owner

# Canonical CI for post-turn shared initial, status widget extract, and wire transport.
# See docs/post-turn-luna-owner.md

on:
  pull_request:
    paths:
      - ".github/workflows/validate-post-turn-luna-owner.yml"
      - "docs/post-turn-luna-owner.md"
      - "src/lib/postTurnSharedInitial/**"
      - "src/lib/memory/memory-episodic-prompt.ts"
      - "src/lib/memory/memory-episodic-shared.ts"
      - "src/lib/postTurnSharedInitialWidgetOutcome.ts"
      - "src/lib/postTurnSharedInitialWidgetOutcome.test.ts"
      - "src/lib/postTurnSharedCallBudget.test.ts"
      - "src/lib/postTurnSharedInitialPartialDualExtract.test.ts"
      - "src/lib/postTurnSharedInitial.semanticEmpty.test.ts"
      - "src/lib/postTurnSharedInitial.schema.test.ts"
      - "src/lib/postTurnSharedInitial.schemaProviderProbe.test.ts"
      - "src/lib/postTurnSharedInitial/widgetShapeDiagnostics.ts"
      - "src/lib/deepseekRegenTurnObservability.test.ts"
      - "src/lib/statusWidget/**"
      - "src/lib/suggestedReplies/**"
      - "src/lib/statusWidget/extractNormalize.ts"
      - "src/lib/openRouterCompletion.ts"
      - "src/lib/openRouterCompletion.cheaperInference.test.ts"
      - "src/lib/ai.ts"
      - "src/lib/ai.backgroundTextPrimary.test.ts"
      - "src/lib/ai.cheaperInferenceBackground.test.ts"
      - "src/lib/chatModels.ts"
      - "src/lib/chatModels.cheaperInference.test.ts"
      - "src/lib/openRouterModelPricing.ts"
      - "src/lib/openRouterModelPricing.cheaperInference.test.ts"
      - "src/lib/promptTranslation.ts"
      - "src/lib/promptTranslation.test.ts"
      - "src/lib/chatImageSceneBrief.ts"
      - "src/lib/chatImageSceneBrief.test.ts"
      - "src/lib/trpg/replySuggestions.ts"
      - "src/lib/trpg/replySuggestions.test.ts"
      - "src/lib/auxProviderProvenance.test.ts"
      - "src/lib/cheaperInferenceConfig.ts"
      - "src/lib/cheaperInferenceConfig.test.ts"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REGULAR_TEST_REAL_PROVIDER_CALLS: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: git diff --check

      - run: npm run lint

      - run: npm run typecheck:app

      - name: Post-turn shared initial wire contract
        run: node --conditions=react-server --import tsx --test src/lib/postTurnSharedInitial/wireRequest.test.ts

      - name: Post-turn shared initial call graph
        run: node --conditions=react-server --import tsx --test src/lib/postTurnSharedInitial/callGraph.test.ts

      - name: Post-turn Luna call budget
        run: node --conditions=react-server --import tsx --test src/lib/postTurnSharedCallBudget.test.ts

      - name: Regen turn receipt observability
        run: node --conditions=react-server --import tsx --test src/lib/deepseekRegenTurnObservability.test.ts

      - name: Shared initial widget outcome
        run: node --conditions=react-server --import tsx --test src/lib/postTurnSharedInitialWidgetOutcome.test.ts

      - name: Shared initial semantic-empty contract
        run: node --conditions=react-server --import tsx --test src/lib/postTurnSharedInitial.semanticEmpty.test.ts

      - name: Shared initial strict schema owner
        run: node --conditions=react-server --import tsx --test src/lib/postTurnSharedInitial.schema.test.ts

      - name: Shared initial prompt regression (P1–P11)
        run: node --conditions=react-server --import tsx --test src/lib/postTurnSharedInitial/promptRegression.test.ts

      - name: Suggested replies lifecycle and decision quality
        run: node --conditions=react-server --import tsx --test src/lib/suggestedReplies/parse.test.ts src/lib/suggestedReplies/generationPresentation.test.ts src/lib/suggestedReplies/greetingLifecycle.test.ts src/lib/suggestedReplies/job.sharedInitial.test.ts src/lib/suggestedReplies/decisionQualityObservatory.test.ts src/lib/suggestedReplies/decisionQualityObservatory.corpus.test.ts src/lib/suggestedReplies/decisionQualityAggregate.test.ts src/lib/suggestedReplies/decisionQualityTelemetry.test.ts src/lib/suggestedReplies/decisionQualityTelemetry.runtime.test.ts src/lib/suggestedReplies/decisionQualityLogReport.test.ts src/lib/suggestedReplies/extract.test.ts

      - name: CheaperInference adapter (response_format preservation)
        run: node --conditions=react-server --import tsx --test src/lib/cheaperInferenceConfig.test.ts

      - name: GPT-6 Luna background owner cutover
        run: node --conditions=react-server --import tsx --test src/lib/ai.backgroundTextPrimary.test.ts src/lib/ai.cheaperInferenceBackground.test.ts src/lib/chatModels.cheaperInference.test.ts src/lib/openRouterModelPricing.cheaperInference.test.ts src/lib/promptTranslation.test.ts src/lib/chatImageSceneBrief.test.ts src/lib/trpg/replySuggestions.test.ts src/lib/auxProviderProvenance.test.ts
