name: Validate billing receipt privacy

on:
  pull_request:
    paths:
      - ".github/workflows/validate-billing-receipt-privacy.yml"
      - "src/lib/publicUsageEconomicsBoundary.ts"
      - "src/lib/publicUsageEconomicsBoundary.test.ts"
      - "src/lib/billingReceiptAccess.ts"
      - "src/lib/billingReceiptAccess.test.ts"
      - "src/components/BillingReceiptTooltip.tsx"
      - "src/components/BillingReceiptTooltip.test.ts"
      - "src/components/MessageBubbleToolbar.tsx"
      - "src/app/api/chat/admin-billing-receipt/**"
      - "src/lib/adminProviderRequestLookup.ts"
      - "src/lib/adminProviderRequestLookupShared.ts"
      - "src/app/admin/finance/AdminFinanceClient.tsx"
      - "src/lib/adminProviderRequestLookup.test.ts"
      - "src/app/api/admin/finance/provider-request/**"
      - "src/lib/subscription.ts"
      - "src/lib/subscriptionBillingSafety.test.ts"
      - "src/app/api/points/subscribe/**"
      - "src/app/api/cron/subscription-renew/**"
      - "src/app/points/page.tsx"

permissions:
  contents: read

jobs:
  billing-receipt-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REGULAR_TEST_REAL_PROVIDER_CALLS: "0"
      SESSION_SECRET: "01234567890123456789012345678901"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Public usage economics boundary
        run: node --conditions=react-server --import tsx --test src/lib/publicUsageEconomicsBoundary.test.ts

      - name: Billing receipt runtime fetch boundary
        run: node --import tsx --test src/components/BillingReceiptTooltip.test.ts

      - name: Subscription recurring-payment safety
        run: node --conditions=react-server --import tsx --test src/lib/subscriptionBillingSafety.test.ts

      - name: Typecheck app
        run: npm run typecheck:app

      - name: Production build
        run: npm run build

      - name: Admin billing receipt route authorization
        run: node --conditions=react-server --import tsx --test src/app/api/chat/admin-billing-receipt/route.test.ts

      - name: Admin provider request forensic route authorization
        run: node --conditions=react-server --import tsx --test src/app/api/admin/finance/provider-request/route.test.ts src/app/api/admin/finance/provider-request/correlate/route.test.ts
